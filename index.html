<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подготовка к экзаменам</title>
    <link rel="stylesheet" href="style.css">
    <!-- Иконки Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }
        .home-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        @media (min-width: 640px) {
            .home-title { font-size: 42px; }
        }
        .home-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 48px;
            max-width: 500px;
        }
        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1000px;
        }
        @media (min-width: 768px) {
            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
        }
        .subject-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .subject-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
        }
        .subject-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            transition: transform 0.3s;
        }
        .subject-card:hover .subject-icon {
            transform: scale(1.1) rotate(5deg);
        }
        .subject-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        .subject-card .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .subject-card:hover .start-btn {
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
        }
        .subject-card .start-btn i {
            transition: transform 0.3s ease;
        }
        .subject-card:hover .start-btn i {
            transform: translateX(4px);
        }

        .theme-toggle-home {
            position: absolute;
            top: 24px;
            right: 24px;
        }
    </style>
</head>
<body>
    <div class="theme-toggle-home">
        <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" title="Сменить тему">
            <i class="ri-moon-line"></i>
        </button>
    </div>

    <main class="container">
        <div class="home-container">
            <div class="icon-box" style="margin-bottom: 24px; width: 64px; height: 64px; font-size: 32px; border-radius: 16px;">
                <i class="ri-graduation-cap-line"></i>
            </div>
            <h1 class="home-title">Подготовка к экзаменам</h1>
            <p class="home-subtitle">Выберите предмет для начала тестирования или изучения материалов.</p>

            <div class="subjects-grid">
                <!-- Карточка 1 -->
                <a href="app.html?subject=math" class="subject-card">
                    <div class="subject-icon">
                        <i class="ri-functions"></i>
                    </div>
                    <h2>Теория вероятности</h2>
                    <div class="start-btn">
                        <span>Начать</span>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </a>

                <!-- Карточка 3 -->
                <a href="app.html?subject=mdk0103" class="subject-card">
                    <div class="subject-icon">
                        <i class="ri-smartphone-line"></i>
                    </div>
                    <h2>01.03 МДК</h2>
                    <div class="start-btn">
                        <span>Начать</span>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </a>

                <!-- Карточка 4 -->
                <a href="app.html?subject=mdk0502" class="subject-card">
                    <div class="subject-icon">
                        <i class="ri-palette-line"></i>
                    </div>
                    <h2>05.02 МДК</h2>
                    <div class="start-btn">
                        <span>Начать</span>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </a>

                <!-- Карточка 5 -->
                <a href="app.html?subject=mdk0301" class="subject-card">
                    <div class="subject-icon">
                        <i class="ri-book-read-line"></i>
                    </div>
                    <h2>03.01 МДК</h2>
                    <div class="start-btn">
                        <span>Начать</span>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script>
        // Проверяем тему в localStorage
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('#theme-toggle i').className = 'ri-sun-line';
        }

        window.toggleTheme = function() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                root.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.querySelector('#theme-toggle i').className = 'ri-moon-line';
            } else {
                root.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.querySelector('#theme-toggle i').className = 'ri-sun-line';
            }
        };
    </script>
</body>
</html>
